name: Android-App bauen (APK)

# Baut aus der Web-App im Wurzelverzeichnis eine installierbare Android-APK.
#
# Gebaut und geprüft wird auf JEDEM Zweig — ein Vorschlag soll durchgerechnet
# sein, bevor er zusammengeführt wird. Veröffentlicht wird die APK aber nur
# von „main" und von Versions-Tags: Am Download-Link in der README hängt die
# Fassung, die jemand auf sein Handy lädt. Da darf kein Zweig-Bau landen, der
# vielleicht nie zusammengeführt wird.
#
# Vom Zweig gibt es die APK trotzdem — unter „Artefakte" beim Lauf selbst.
#
# Nach jedem Push auf „main" hängt die fertige APK am Release „v1.0" — der
# Download-Link bleibt dabei immer derselbe (siehe APK-HERUNTERLADEN.md).

on:
  push:
    branches: [ "**" ]
    paths:
      # Die Web-App liegt in online/ — von dort holt sie der Build.
      - "online/**"
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Ohne festen Schlüssel bekäme jede APK eine andere Signatur — dann ließe sich
      # kein Update über eine bestehende Installation legen (nur deinstallieren, was
      # den gespeicherten Text und den API-Schlüssel löscht). Der Schlüssel liegt als
      # Base64 in den Repository-Secrets. Fehlt er, wird eine Debug-APK gebaut.
      - name: Signaturschlüssel bereitstellen
        id: schluessel
        env:
          KEYSTORE_B64: ${{ secrets.SIGNIER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
            echo "Signaturschlüssel gefunden — es wird eine Release-APK gebaut."
          else
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
            echo "::warning::Kein SIGNIER_KEYSTORE_B64 hinterlegt — es wird eine Debug-APK gebaut. Updates über eine bestehende Installation sind damit NICHT möglich."
          fi

      - name: APK bauen
        working-directory: android
        env:
          SIGNIER_KEYSTORE: ${{ steps.schluessel.outputs.vorhanden == 'ja' && format('{0}/release.jks', runner.temp) || '' }}
          SIGNIER_KEYSTORE_PASSWORT: ${{ secrets.SIGNIER_KEYSTORE_PASSWORT }}
          SIGNIER_ALIAS: ${{ secrets.SIGNIER_ALIAS }}
          SIGNIER_ALIAS_PASSWORT: ${{ secrets.SIGNIER_ALIAS_PASSWORT }}
          # Laufnummer als versionCode: Android verlangt für ein Update eine höhere Zahl.
          #
          # Dazu 1000 addiert, damit die APK von hier IMMER über einer selbst
          # gebauten Testfassung liegt. Ohne den Abstand genügt ein Probelauf mit
          # hoch gesetzter Nummer auf dem eigenen Rechner, und die nächste APK von
          # GitHub gilt als Rückschritt — Android verweigert dann das Update, und
          # man müsste deinstallieren, samt Textverlust.
          # Der Bereich unter 1000 gehört also den Testfassungen.
          #
          # Gerechnet wird unten in der Shell: Die Ausdrücke von GitHub Actions
          # beherrschen Vergleiche und Und/Oder, aber kein Plus. `run_number + 1000`
          # bricht den Lauf ab, noch bevor ein Schritt anfängt.
          LAUF_NUMMER: ${{ github.run_number }}
        run: |
          export VERSION_CODE=$((LAUF_NUMMER + 1000))
          echo "versionCode dieser APK: $VERSION_CODE"
          chmod +x ./gradlew
          if [ "${{ steps.schluessel.outputs.vorhanden }}" = "ja" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: APK umbenennen
        run: |
          mkdir -p out
          if [ "${{ steps.schluessel.outputs.vorhanden }}" = "ja" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/schreibhilfe.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/schreibhilfe.apk
          fi
          ls -lh out/schreibhilfe.apk

      # Ein früherer Versuch lief grün durch und lieferte trotzdem eine APK OHNE
      # Web-App — die App wäre auf dem Handy weiß geblieben. Deshalb hier eine
      # harte Kontrolle, bevor irgendetwas veröffentlicht wird.
      #
      # Sie prüft nicht nur, ob die Dateien DA sind, sondern ob sie DIESELBEN
      # sind: Byte für Byte gegen online/. Vorhandensein allein sagt nichts —
      # eine APK mit einer veralteten style.css bestünde die Prüfung, und auf
      # dem Handy änderte sich nach dem Update nichts. Genau das ist der Fehler,
      # den man am schwersten bemerkt.
      - name: Prüfen, ob die Web-App aktuell in der APK steckt
        run: |
          python3 - <<'PY'
          import sys, zipfile, hashlib, os

          apk = zipfile.ZipFile("out/schreibhilfe.apk")
          drin = {n for n in apk.namelist() if n.startswith("assets/www/")}

          noetig = ["assets/www/index.html", "assets/www/css/style.css",
                    "assets/www/js/app.js", "assets/www/sw.js"]
          fehlt = [d for d in noetig if d not in drin]
          if fehlt:
              print("::error::Die APK enthält die Web-App nicht: " + ", ".join(fehlt))
              sys.exit(1)

          # Jede mitgelieferte Datei muss Byte für Byte der Quelle entsprechen.
          abweichend = []
          for name in sorted(drin):
              quelle = os.path.join("online", name[len("assets/www/"):])
              if not os.path.isfile(quelle):
                  abweichend.append(name + " (keine Quelle in online/)")
                  continue
              a = hashlib.sha256(open(quelle, "rb").read()).hexdigest()
              b = hashlib.sha256(apk.read(name)).hexdigest()
              if a != b:
                  abweichend.append(name + " (Inhalt weicht von online/ ab)")
              else:
                  print("  gleich: " + name)

          if abweichend:
              for a in abweichend:
                  print("::error::" + a)
              print("::error::Die APK trägt eine andere Fassung der Web-App als online/.")
              sys.exit(1)

          # Kein Abbruch: Nicht alles in online/ gehört in die APK (die
          # Kopierregel in build.gradle lässt etwa icon-maskable.svg aus).
          # Aber sichtbar sein soll es, falls jemand eine neue Datei anlegt
          # und die Regel vergisst.
          for pfad, _, dateien in os.walk("online"):
              for d in dateien:
                  lokal = os.path.join(pfad, d)
                  erwartet = "assets/www/" + os.path.relpath(lokal, "online")
                  if erwartet not in drin:
                      print("::notice::nicht in der APK: " + erwartet
                            + " — falls gewollt, ist alles gut; sonst fehlt eine"
                            + " include-Zeile in android/app/build.gradle")
          PY

      - name: Schlüssel wieder entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: schreibhilfe-apk
          path: out/schreibhilfe.apk
          if-no-files-found: error

      - name: Release mit APK veröffentlichen (direkter Download, ohne ZIP)
        if: >-
          github.event_name == 'push'
          && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Schreibhilfe v1.0' }}
          make_latest: true
          files: out/schreibhilfe.apk
          body: |
            Installierbare Android-App — Schreibhilfe.

            **Herunterladen:** unten unter „Assets" → `schreibhilfe.apk`.
            **Installieren:** APK aufs Handy laden, öffnen, „Aus dieser Quelle installieren" erlauben.

            Neu ab dieser Fassung: In WhatsApp, Facebook oder der Mail-App den Text
            markieren → **Teilen → Schreibhilfe**. Der Text landet direkt im
            Schreibfeld und wird sofort geprüft.

            _Dieses Release wird bei jeder Änderung automatisch mit der aktuellen APK aktualisiert._
