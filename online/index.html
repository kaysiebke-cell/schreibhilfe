<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>Schreib hilfe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schreibhilfe">
<link rel="stylesheet" href="css/style.css">
<script>
  // Hell/Dunkel VOR dem Zeichnen setzen — sonst blitzt beim Start die falsche Farbe auf.
  // Drei Stellungen: "auto" folgt dem Handy, "light" und "dark" sind fest.
  var systemDunkel = matchMedia('(prefers-color-scheme: dark)').matches;
  var wahl = 'auto';
  try {
    // Gespeichert wird als JSON ("dark"), gebraucht wird der nackte Wert (dark).
    var g = JSON.parse(localStorage.getItem('sh.theme'));
    if (g === 'dark' || g === 'light' || g === 'auto') wahl = g;
  } catch (e) {}
  document.documentElement.dataset.theme =
    (wahl === 'dark' || (wahl === 'auto' && systemDunkel)) ? 'dark' : 'light';
</script>
</head>
<body>

<!-- Icon-Vorrat: einfarbige Strich-Icons, per <use href="#i-…"> geholt. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-sparkle"  viewBox="0 0 24 24"><path d="M11 3l1.7 4.8L17.5 9.5 12.7 11.2 11 16l-1.7-4.8L4.5 9.5l4.8-1.7z"/><path d="M18 15l.7 1.9 1.9.7-1.9.7L18 21l-.7-1.7-1.9-.7 1.9-.7z"/></symbol>
  <symbol id="i-undo"     viewBox="0 0 24 24"><path d="M4 10h10a5 5 0 1 1 0 10h-3M8 6l-4 4 4 4"/></symbol>
  <symbol id="i-zurueck"  viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
  <symbol id="i-einspielen" viewBox="0 0 24 24"><path d="M12 3v11M8 10l4 4 4-4M4 20h16"/></symbol>
  <symbol id="i-auge"     viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></symbol>
  <symbol id="i-share"    viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></symbol>
  <symbol id="i-copy"     viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-trash"    viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l.9 12a2 2 0 0 0 2 1.9h5.2a2 2 0 0 0 2-1.9L17.5 7"/></symbol>
  <symbol id="i-check"    viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.1 14.6a1.5 1.5 0 0 0 .3 1.7l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.5 1.5 0 0 0-1.7-.3 1.5 1.5 0 0 0-.9 1.4v.3a2 2 0 1 1-4 0v-.2a1.5 1.5 0 0 0-1-1.4 1.5 1.5 0 0 0-1.7.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.5 1.5 0 0 0 .3-1.7 1.5 1.5 0 0 0-1.4-.9H3a2 2 0 1 1 0-4h.2a1.5 1.5 0 0 0 1.4-1 1.5 1.5 0 0 0-.3-1.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.5 1.5 0 0 0 1.7.3H9a1.5 1.5 0 0 0 .9-1.4V3a2 2 0 1 1 4 0v.2a1.5 1.5 0 0 0 .9 1.4 1.5 1.5 0 0 0 1.7-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.5 1.5 0 0 0-.3 1.7V9a1.5 1.5 0 0 0 1.4.9h.3a2 2 0 1 1 0 4h-.2a1.5 1.5 0 0 0-1.4.9z"/></symbol>
  <symbol id="i-moon"     viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></symbol>
  <symbol id="i-sun"      viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 12H2M22 12h-2.2M6.5 6.5L4.9 4.9M19.1 19.1l-1.6-1.6M17.5 6.5l1.6-1.6M4.9 19.1l1.6-1.6"/></symbol>
  <!-- Halb gefüllter Kreis: das übliche Zeichen für „richtet sich nach dem Gerät“. -->
  <symbol id="i-auto"     viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-mehr" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></symbol>
  <symbol id="i-close"    viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-laut"     viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M15.5 9.5a4 4 0 0 1 0 5M18 7a7.5 7.5 0 0 1 0 10"/></symbol>
  <!-- Erdkugel: das übliche Zeichen für Sprache und Übersetzen. -->
  <symbol id="i-globus"   viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.2 2.3 3.4 5.3 3.4 8.5s-1.2 6.2-3.4 8.5c-2.2-2.3-3.4-5.3-3.4-8.5S9.8 5.8 12 3.5z"/></symbol>
</svg>

<!-- Der Name in Systemschrift, wie das Gerät seine eigenen Apps beschriftet.
     Die zweifarbige Wortmarke in Serifen stand quer zu allem anderen. -->
<header class="topbar">
  <h1 class="app-titel">Schreibhilfe</h1>

  <div class="topbar__tools">
    <button class="topbar__icon" id="btn-settings" title="Einstellungen" aria-label="Einstellungen"><svg class="ic"><use href="#i-settings"></use></svg></button>
  </div>
</header>

<main id="app">
  <!-- Hinter dem Schreibfeld liegt ein Zwilling mit demselben Text — unsichtbar
       bis auf den farbigen Streifen hinter dem Wort, an dem gerade geschrieben
       wird. Im Feld selbst geht das nicht: ein <textarea> lässt sich innen
       nicht einfärben. Der Text bleibt der des Feldes, deshalb unterringelt die
       Tastatur weiterhin, und Markieren und Diktieren merken nichts davon. -->
  <div class="feld">
    <div id="spiegel" aria-hidden="true"></div>
    <textarea id="text"
      placeholder="Hier schreiben oder diktieren."
      spellcheck="true" lang="de" autocapitalize="sentences"
      autocorrect="on" aria-label="Dein Text"></textarea>

    <!-- Nach dem Korrigieren liegt hier der fertige Text mit GRÜNEN Wörtern.
         Ein <textarea> lässt sich innen nicht einfärben — deshalb diese
         Ansicht darüber. Ein Tipp darauf, und man schreibt wieder im Feld. -->
    <div id="ergebnis" class="ergebnis" hidden tabindex="0"
         role="button" aria-label="Ergebnis — antippen zum Weiterschreiben"></div>
  </div>

  <!-- Vorschläge zu dem Wort, an dem gerade geschrieben wird. Steht das Wort
       nicht im Wörterbuch, stehen hier Verbesserungen; steht es dort und ist
       noch nicht fertig, stehen hier Fortsetzungen. Am Handy gibt es keinen
       Rechtsklick — deshalb eine Leiste statt eines Menüs, und sie erscheint
       von selbst, statt darauf zu warten, dass jemand sie sucht. -->
  <div id="vorschlaege" class="vorschlaege" hidden aria-live="polite"
       aria-label="Wortvorschläge"></div>

  <!-- Die Funde entstehen erst nach dem Prüfen. Ohne „aria-live" bekommt eine
       Vorlesefunktion gar nicht mit, dass hier etwas erschienen ist. -->
  <div id="funde" role="region" aria-live="polite" aria-label="Gefundene Stellen"></div>
  <p class="hint" id="status" role="status"></p>

</main>

<footer class="leiste">
  <!-- EIN Knopf. Er prüft, wendet alles Eindeutige an und zeigt das Ergebnis —
       kein Auswählen, kein Fenster davor. Was danach zu tun ist, erscheint erst
       danach: der Weg zurück, und falls es nicht passt, Rückgängig. -->
  <button class="btn btn--haupt" id="btn-pruefen">
    <svg class="ic"><use href="#i-check"></use></svg> Korrigieren
  </button>

  <!-- Drei Stufen statt zweier gleich großer Blöcke: „Zurückgeben" ist der
       eine richtige Weg (gefüllt), „Teilen" der zweitbeste (getönt), und was
       selten gebraucht wird, steht als bloßes Wort darunter. Am Rechner gibt
       es kein Zurückgeben — dann ist „Teilen" von selbst das Auffälligste. -->
  <div id="danach" class="danach" hidden>
    <button class="btn btn--haupt" id="btn-zurueckgeben" hidden>
      <svg class="ic"><use href="#i-undo"></use></svg> <span id="wort-zurueck">Zurückgeben</span>
    </button>
    <button class="btn btn--haupt btn--tonal" id="btn-teilen">
      <svg class="ic"><use href="#i-share"></use></svg> Teilen
    </button>
  </div>

  <!-- Mülleimer und Rückgängig standen bis hierher IN „danach" — also erst
       sichtbar, nachdem das Korrigieren etwas gefunden hatte. Wer sich nur
       vertippt hatte, kam gar nicht an sie heran und musste den ganzen Text
       von Hand markieren. Jetzt stehen sie außerhalb und damit immer da:
       der Eimer, sobald etwas im Feld steht, Rückgängig, sobald es etwas
       zurückzunehmen gibt. Ist beides nichts, ist die Zeile weg — sonst
       risse die Lücke die Leiste unnötig auseinander. -->
  <div id="klein" class="leiste__klein" hidden>
    <button class="btn btn--text" id="btn-zurueck" hidden>
      <svg class="ic"><use href="#i-undo"></use></svg> Rückgängig
    </button>
    <button class="btn btn--text" id="btn-vorlesen" hidden>
      <svg class="ic"><use href="#i-laut"></use></svg> <span id="wort-vorlesen">Vorlesen</span>
    </button>
    <button class="btn btn--text btn--gefahr" id="btn-leeren" hidden>
      <svg class="ic"><use href="#i-trash"></use></svg> Löschen
    </button>
  </div>
</footer>

<!-- Korrigieren und Übersetzen stehen zusammen hinter dem KI-Knopf: Beides
     braucht denselben Schlüssel und dasselbe Internet, und ein sechster Knopf
     hätte die Leiste auf schmalen Handys wieder aufgeklappt. -->

<!-- Was man selten braucht, steht hinter den drei Punkten. Vorher standen
     Kopieren, Einfügen und Löschen dauerhaft in der Leiste und machten aus
     vier Knöpfen sieben. -->




<!-- Die Einstellungen sind ein eigener Bildschirm, kein Fenster im Fenster:
     Das Zahnrad tauscht den Schreibbildschirm gegen diesen hier aus, der Pfeil
     und die Android-Zurück-Taste bringen zurück. Immer nur eine Ebene. -->
<section id="dlg-settings" class="seite" hidden>
  <div class="seite__kopf">
    <button class="topbar__icon" id="btn-settings-zu" aria-label="Zurück zum Text"><svg class="ic"><use href="#i-zurueck"></use></svg></button>
    <h2>Einstellungen</h2>
  </div>

  <!-- Gruppen mit Überschrift statt einer einzigen langen Liste, in der
       Schlüssel, Schriftgröße und Gedächtnis gleich viel wogen. Die Reihenfolge
       ist die alte, es sind nur Zäune drumherum. -->
  <div class="form">

    <div class="gruppe">
      <span class="gruppe__titel">KI-Werkzeuge</span>
      <div class="karte">

        <label class="field" id="feld-api-key">
          API-Schlüssel <em>für Korrigieren und Übersetzen</em>
          <input id="api-key" type="password" placeholder="sk-ant-…" autocomplete="off">
          <!-- Das Feld zeigt Punkte statt Zeichen. Ohne diese Zeile sieht
               niemand, ob überhaupt etwas gespeichert ist. -->
          <div class="zeile">
            <p class="hint" id="schluessel-stand"></p>
            <!-- Öffnet den Systembrowser: Die WebView reicht fremde Adressen an
                 Android weiter, damit man nicht in der App festhängt. -->
            <a class="verweis" href="https://platform.claude.com/settings/keys"
               target="_blank" rel="noopener">Schlüssel erstellen&nbsp;↗</a>
          </div>
          <!-- Um den Schlüssel auf ein zweites Gerät zu bekommen, muss man ihn
               sehen oder kopieren können. „Anzeigen“ blendet ihn nur kurz auf
               und verbirgt ihn von selbst wieder. -->
          <div class="reihe-klein">
            <button class="btn btn--klein" id="btn-schluessel-zeigen" type="button">
              <svg class="ic"><use href="#i-auge"></use></svg> <span id="wort-zeigen">Anzeigen</span>
            </button>
            <button class="btn btn--klein" id="btn-schluessel-kopieren" type="button">
              <svg class="ic"><use href="#i-copy"></use></svg> Kopieren
            </button>
          </div>
        </label>

        <!-- EINE Liste für alles. Oben die drei von Claude, darunter das,
             was auf diesem Rechner liegt — die trägt app.js beim Öffnen nach,
             denn was installiert ist, weiß nur der Rechner selbst. Zwei
             getrennte Fragen („woher?" und „welches?") wären eine Frage zu
             viel: Wer „Opus 5" wählt, hat damit schon gesagt, wohin es geht. -->
        <label class="field" id="feld-modell">
          KI-Modell
          <select id="modell">
            <optgroup label="Claude im Netz — braucht Schlüssel und Guthaben">
              <option value="claude-opus-5">Beste Qualität &middot; Opus 5</option>
              <option value="claude-sonnet-5">Mittelweg &middot; Sonnet 5</option>
              <option value="claude-haiku-4-5">Günstig &amp; schnell &middot; Haiku 4.5</option>
            </optgroup>
            <optgroup label="Auf diesem Rechner — kostenlos, ohne Internet" id="modell-lokal"></optgroup>
          </select>
          <em id="modell-hinweis"></em>
        </label>

        <!-- Der Tonfall stand bis hierher als Liste an dieser Stelle. Er ist
             jetzt die Frage „Für wen?" im Kasten unter den Funden — dort, wo
             gleich danach auf „KI-Korrektur" gedrückt wird. Im Zahnrad sah ihn
             niemand, und eine Wahl, die man nicht sieht, wirkt wie eine Laune
             der Maschine. Bleibt der Hinweis, damit niemand hier sucht. -->
        <div class="field">
          Für wen der Text ist
          <em>Steht beim Korrigieren: „Für wen?" und der Zettel „Worum geht’s?"
            im Kasten unter den Funden.</em>
        </div>

        <!-- Was bisher verbraucht wurde. Zählt die App selbst mit, aus den
             Angaben, die jede Antwort mitliefert — der Blick ins Dashboard
             bleibt einem damit erspart. -->
        <div class="field">
          Verbrauch
          <div class="zeile">
            <p class="hint" id="kosten-stand"></p>
            <button class="btn btn--klein" id="btn-kosten-weg" type="button" hidden>zurücksetzen</button>
          </div>
          <div class="zeile">
            <a class="verweis" href="https://platform.claude.com/settings/billing"
               target="_blank" rel="noopener">Guthaben aufladen&nbsp;↗</a>
          </div>
        </div>

        <label class="field">Übersetzen <em>braucht den Schlüssel und Internet</em>
          <!-- KI-Korrektur und Vorschläge stehen als Kasten unter den Funden,
               nicht mehr hier. Diese beiden bleiben versteckt, weil ihre
               Verdrahtung dort weiterhin gebraucht wird. -->
          <button id="btn-korrigieren" type="button" hidden></button>
          <button id="btn-formulieren" type="button" hidden></button>
          <div class="reihe-klein">
            <select id="zielsprache" aria-label="Zielsprache"><option value="Deutsch">Deutsch</option><option value="Englisch">Englisch</option><option value="Türkisch">Türkisch</option><option value="Polnisch">Polnisch</option><option value="Russisch">Russisch</option><option value="Arabisch">Arabisch</option></select>
            <!-- Das Wort steckt in einem eigenen span: app.js schreibt beim
                 Sprachwechsel „Nach Englisch übersetzen“ hinein. Ohne den span
                 brach die Zeile mit einem Fehler ab. -->
            <button class="btn btn--klein" id="btn-uebersetzen" type="button"><svg class="ic"><use href="#i-globus"></use></svg> <span class="btn__wort">Übersetzen</span></button>
          </div>
        </label>

      </div>
    </div>

    <div class="gruppe">
      <span class="gruppe__titel">Beim Schreiben</span>
      <div class="karte">
        <label class="field field--schalter">
          <span>Wort hervorheben
            <em>Ein farbiger Streifen zeigt beim Schreiben, wo du gerade bist.</em>
          </span>
          <input id="wortmarker" type="checkbox">
        </label>

        <!-- Nur sichtbar, wenn das Gerät eine Systempalette liefert (Android 12+). -->
        <label class="field field--schalter" id="feld-systemfarben" hidden>
          <span>Farben vom System übernehmen
            <em>Android 12 und neuer. Sie richten sich nach deinem Hintergrundbild.</em>
          </span>
          <input id="systemfarben" type="checkbox">
        </label>
      </div>
    </div>

    <div class="gruppe">
      <span class="gruppe__titel">Gedächtnis</span>
      <div class="karte">
        <!-- Was die App sich gemerkt hat. Sichtbar, weil niemand ein Gedächtnis
             über sich haben sollte, in das er nicht hineinsehen kann — und weil
             eine falsch gelernte Schreibweise sonst für immer bliebe. -->
        <label class="field">Gelernte Schreibweisen <em>bleiben auf dem Gerät</em>
          <div class="zeile">
            <p class="hint" id="gelernt-stand"></p>
            <button class="btn btn--klein" id="btn-gelernt-weg" type="button" hidden>vergessen</button>
          </div>
          <!-- Handy und PC lernen getrennt. Der Sicherungs-Text ist die Brücke:
               auf dem einen Gerät kopieren, auf dem anderen einsetzen. Der
               API-Schlüssel bleibt bewusst draußen — ein Schlüssel gehört nicht
               in einen Text, den man durch die Gegend schickt. -->
          <div class="reihe-klein">
            <button class="btn btn--klein" id="btn-sichern" type="button">
              <svg class="ic"><use href="#i-copy"></use></svg> Sichern
            </button>
            <button class="btn btn--klein" id="btn-einspielen" type="button">
              <svg class="ic"><use href="#i-einspielen"></use></svg> Einspielen
            </button>
          </div>
        </label>
      </div>
    </div>

    <div class="gruppe">
      <span class="gruppe__titel">Darstellung</span>
      <div class="karte">
        <div class="field">Schrift und Helligkeit
          <div class="reihe-klein">
            <button class="btn btn--klein" id="btn-kleiner" type="button"><span class="schriftknopf">A&minus;</span> kleiner</button>
            <button class="btn btn--klein" id="btn-groesser" type="button"><span class="schriftknopf gross">A+</span> größer</button>
            <button class="btn btn--klein" id="btn-theme" type="button"><svg class="ic"><use href="#i-auto" id="theme-symbol"></use></svg> Hell/Dunkel</button>
          </div>
          <!-- Die Knöpfe wirken auf das Schreibfeld — und das ist von hier aus
               nicht zu sehen. Ohne diese Probezeile drückt man A+ und nichts
               passiert; die Knöpfe wirken kaputt, obwohl sie tun, was sie
               sollen. Die Zeile trägt dieselbe Schrift wie das Schreibfeld. -->
          <p class="schriftprobe" id="schriftprobe">So groß schreibst du.</p>
          <p class="hint" id="schriftstand"></p>
        </div>
      </div>
    </div>

    <p class="hint" id="fassung"></p>

    <div class="form__actions">
      <button class="btn btn--text" id="btn-schluessel-weg">Schlüssel löschen</button>
      <button class="btn btn--haupt" id="btn-speichern">Speichern</button>
    </div>
  </div>
</section>

<!-- Der gemeinsame Wortschatz der Prüfung. Muss VOR app.js stehen: app.js
     baut daraus schon beim Laden seine regulären Ausdrücke. -->
<script src="daten/regeln.js"></script>
<script src="js/app.js"></script>
<script src="js/systempruefer.js"></script>
</body>
</html>
